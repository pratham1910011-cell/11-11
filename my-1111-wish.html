<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MY 11:11 WISH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg1:#f6f0ff;--bg2:#e9f1ff;--bg3:#fdeef4;--ink:#4b4560;--hint:#7b7595;--blue1:#2a4d9b;--blue2:#4372cf;--box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2748;--bg2:#1f2a4a;--bg3:#3a2740;--hint:#b9b3d6}}
:root[data-theme="dark"]{--bg1:#2a2748;--bg2:#1f2a4a;--bg3:#3a2740;--hint:#b9b3d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#fw{z-index:50;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.o1{width:40vmax;height:40vmax;left:-10vmax;top:-8vmax;background:radial-gradient(#ffd9ea,transparent 65%)}
.o2{width:46vmax;height:46vmax;right:-14vmax;bottom:-12vmax;background:radial-gradient(#cfe0ff,transparent 65%);animation-delay:-6s}
.o3{width:30vmax;height:30vmax;left:55%;top:5%;background:radial-gradient(#fff1c9,transparent 65%);animation-delay:-11s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.12)}}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;perspective:1600px}
#float{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#book{--w:min(80vw,400px,calc((100dvh - 150px)*.7));width:var(--w);aspect-ratio:1/1.42;position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.4,.1,.2,1);cursor:pointer;touch-action:pan-y}
#book.closed{transform:rotateY(-16deg) rotateX(4deg)}
.base{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:linear-gradient(135deg,var(--blue1),var(--blue2));box-shadow:2px 2px 0 #f4efe3,4px 4px 0 #e5dfcf,6px 6px 0 #d6cfbd,0 34px 60px -12px rgba(60,80,160,.42),0 0 50px rgba(150,180,255,.35)}
.leaf{position:absolute;inset:0;perspective:2200px}
.in{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 12px 12px 4px;overflow:hidden}
.back{transform:rotateY(180deg)}
.paper{background:linear-gradient(100deg,#ece4d2 0,#fffdf7 6%,#fffaf0 100%)}
.paper::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,50,90,.16),transparent 9%);pointer-events:none}
.bp{background:linear-gradient(260deg,#ece4d2 0,#fbf6ea 14%,#f6f0e2)}
.cover{background:linear-gradient(135deg,var(--blue1),var(--blue2) 60%,#5a8be3);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.cover::before{content:"";position:absolute;inset:5%;border:1.5px solid rgba(255,255,255,.7);border-radius:3px 8px 8px 3px}
.cover::after{content:"";position:absolute;inset:6.6%;border:1px solid rgba(255,255,255,.35);border-radius:2px 6px 6px 2px}
.cover .sp{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,30,.3),transparent 8%,rgba(255,255,255,.12) 9%,transparent 14%)}
.ttl{position:relative;z-index:1;line-height:1;text-shadow:0 0 18px rgba(255,255,255,.55)}
.ttl i{display:block;font-style:normal;font-weight:500;font-size:calc(var(--w)*.09);letter-spacing:.45em;padding-left:.45em}
.ttl b{display:block;font-weight:600;font-size:calc(var(--w)*.27);margin:.08em 0;letter-spacing:.02em}
.ttl small{display:block;margin-top:calc(var(--w)*.1);font-size:calc(var(--w)*.05);opacity:.85;letter-spacing:.1em;font-style:italic}
.star{position:absolute;color:#fff;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.ic{background:linear-gradient(260deg,#3d68c0,#5b88e0);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.12)}
.txt{position:absolute;inset:15% 10% 13% 12%;overflow:hidden;display:flex;align-items:center}
.txt p{margin:0;line-height:1.6;font-weight:500;text-align:left;hyphens:auto;color:var(--ink);color:#4b4560}
.pn{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-size:calc(var(--w)*.04);color:#a39cb8;font-style:italic}
.sig{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--w)*.08);position:absolute;inset:8%}
.sig h2{font-family:"Dancing Script",cursive;font-weight:600;font-size:calc(var(--w)*.115);line-height:1.2;margin:0;color:#3a62b8}
.sig button{font:inherit;font-size:calc(var(--w)*.05);padding:.7em 1.5em;border:1px solid #4372cf;color:#fff;background:linear-gradient(135deg,var(--blue1),var(--blue2));border-radius:99px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(60,100,200,.6);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(80,120,220,.12),0 8px 20px -6px rgba(60,100,200,.6)}}
.deco{position:absolute;top:4.2%;left:0;right:0;text-align:center;font-size:calc(var(--w)*.07);letter-spacing:.25em;z-index:2;animation:dc 3.2s ease-in-out infinite;pointer-events:none}
@keyframes dc{50%{transform:translateY(-3px) scale(1.07)}}
.pop{position:fixed;z-index:45;pointer-events:none;animation:rise 2.6s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,20px) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(var(--r))}}
.cap{position:fixed;left:50%;z-index:46;pointer-events:none;white-space:nowrap;padding:.4em 1.1em;border-radius:99px;background:rgba(255,255,255,.85);color:#3a62b8;font-size:18px;font-style:italic;box-shadow:0 8px 24px -8px rgba(80,110,200,.5);animation:cap 2.6s ease forwards}
@keyframes cap{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px)}}
.fly{position:fixed;z-index:44;pointer-events:none;font-size:34px;left:0;animation:fly 3.4s linear forwards}
@keyframes fly{from{transform:translate(-12vw,0)}to{transform:translate(112vw,var(--fy,0px))}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,45,90,.6),rgba(40,45,90,0) 85%);opacity:0;pointer-events:none;z-index:3}
.gone{visibility:hidden}
#hint{font-size:15px;font-style:italic;color:var(--hint);letter-spacing:.04em;text-align:center;min-height:1.4em;transition:opacity .6s}
#wish{position:fixed;left:0;right:0;top:9%;text-align:center;z-index:60;pointer-events:none;opacity:0;transition:opacity 1.2s}
#wish.on{opacity:1}
#wish h3{font-family:"Dancing Script",cursive;font-size:clamp(32px,8vw,60px);margin:0;color:#3a62b8;text-shadow:0 0 22px rgba(255,255,255,.9)}
#wish p{margin:.2em 0 0;font-size:clamp(16px,3.6vw,22px);font-style:italic;color:var(--hint)}
#again{position:fixed;bottom:calc(6% + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:61;font:inherit;font-size:17px;padding:.6em 1.6em;border-radius:99px;border:1px solid #4372cf;background:rgba(255,255,255,.75);color:#2a4d9b;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s}
#again.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="stage">
  <div id="float"><div id="book" class="closed" aria-label="MY 11:11 WISH — tap to open"><div class="base"></div></div></div>
  <div id="hint">tap the book to open it</div>
</div>
<div id="wish"><h3>Make a wish</h3><p>11:11</p></div>
<button id="again">Read again</button>
<canvas id="fw"></canvas>

<script>
const P=[
"I was never a believer of any kind of superstition, but then I met you. I came across the 11:11 theory many times but never wished for anything. After meeting you, though, all I have asked for at every 11:11 is you, and only you.",
"Meeting you was the best blessing I have ever received in my entire life. Yes, we might not have interacted much in the beginning. You had your reasons; you had a layer and a boundary that you did not let everyone cross. But still, I always felt a pull to stay with you and get to know you more.",
"We did not spend much time together, but whatever you managed for me on each of my visits, I appreciated and cherished every moment. All those moments and memories have a permanent place in my core memory. Our late-night walk is still my favourite among them all. And yes, the Uber driver should have charged her car — that will be my biggest regret ever.",
"Even when you left for India, I know you did not share much with me. I don’t know, maybe I was not even that trustworthy to you at that time. But I really felt a big void after you left. We were not in the same city beforehand either, but you being in another country made the gap bigger for me. Moreover, I was worried about how hard it would be for you to adapt in India.",
"But still, things worked out; we shared things, we talked. I still do not exactly know how to explain it, but your sharing things made me feel that, yes, I should be there for her to make her life easier by all means. I would not say I was not affectionate towards you earlier, but my care for you grew more.",
"Then I had my own tough situation of coming back here, but you still consoled me a lot and helped me through it. I really appreciate you for that, and always will.",
"But I guess if you were not in my life, I would have much less motivation, aim and direction. All my life I always thought of the easiest methods of getting something done, but after you, I even want to choose and succeed in the hard ones, if they lead to your happiness.",
"I never knew I would be this lucky, to meet someone like you and get to know you like this. I know you might have past experiences that led you to create a gap from men, to set that boundary. But I guess just being myself worked for me, and you let me know you more. I will always be grateful for what you are to me right now.",
"I know people have their own ideas about girls, but a wise girl who is selectively emotional chose me to talk about all the little things, and that makes me feel more privileged than any achievement would. You are someone who has done and seen enough in life, and I promise I am with you only with the intention of making your life the best from here.",
"I might not be the smartest or best-looking guy you have met or will meet, but I can guarantee that nobody will ever match my efforts for you in any way. I will put my best ability into making your wishes come true. Whatever you ask for will be fulfilled.",
"I am someone who had given up on God, and has started believing again, this time a bit more greedily. I never asked for anything in my entire life, but now I have started asking for you to stay.",
"I know you are going through a lot; there is a lot on your mind and in your life. I know you have enough battles to fight and enough achievements to conquer. But all I ask is: let me be by your side. I won’t ask for anything else.",
"I know you are brave and bold enough to handle all of this alone, but just in case you ever need someone, let me be there. I will always be your biggest cheerleader and biggest supporter, even when times turn super rough.",
"All I ask is to be someone you can look to without hesitation whenever you need support. I might not be as good or as intelligent as you, but I will never let you down; I assure you of that. I know you do not want any additional pressure in your life, and I promise I will take the stress out of it and make it happy, if you stay.",
"It is just a short book, but I could write 1,000 pages and it would still fall short of describing you. You are someone whose beauty is beyond words in every way. Let me be by your side, your supportive guy, for the rest of my life."
];
const D=["✨🕚✨","🌸💙🌸","🌙🚶‍♂️🚗","✈️🌏✈️","💌💬💌","🫂🕊️🤍","⛰️🌟⛰️","🍀✨🍀","🦋🌷🦋","🪄⭐🪄","🕯️🙏🕯️","🛡️🏆🛡️","📣🎉📣","🤝🌈🤝","📖💫📖","💖💙💖"];
const E=[["🌠","⭐","🕚","✨"],["🌸","🌼","💙","✨"],["🌙","⭐","🚗","💫"],["☁️","🌏","✨","💙"],["💌","💬","💙","✨"],["🕊️","🤍","🫂","✨"],["⛰️","🌟","💪","✨"],["🍀","🌈","✨","💙"],["🦋","🌷","✨","💜"],["⭐","🪄","🎁","✨"],["🕯️","🙏","✨","🤍"],["🏆","🛡️","🌟","✨"],["🎉","📣","⭐","💙"],["🌈","🤝","☀️","✨"],["📖","💫","✨","💙"],["❤️","💖","💙","💞"]];
const C=["11:11 ✦ make a wish","a blessing","a late-night walk","far away, still close","we talked","you helped me through","hard things, for your happiness","so lucky","a wise girl","wishes come true","believing again","by your side","your biggest cheerleader","you can count on me","1,000 pages, still not enough","I love you"];
const F={0:['🌠','8vh','30vh'],2:['🚗','__low','0px'],3:['✈️','__high','-90px']};
function pop(n){
  if(n<1||n>=L)return;
  const k=n-1,r=book.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const add=(el,ms)=>{document.body.appendChild(el);setTimeout(()=>el.remove(),ms)};
  const cap=document.createElement('div');cap.className='cap';cap.textContent=C[k];cap.style.top=Math.max(r.top-50,10)+'px';add(cap,2700);
  const cnt=k===15?28:14;
  for(let i=0;i<cnt;i++)setTimeout(()=>{
    const s=document.createElement('span');s.className='pop';s.textContent=E[k][i%4];
    s.style.cssText=`left:${cx+(Math.random()-.5)*r.width*.9}px;top:${cy+(Math.random()-.2)*r.height*.45}px;font-size:${16+Math.random()*22}px;--dx:${(Math.random()-.5)*170}px;--dy:${-120-Math.random()*240}px;--r:${(Math.random()-.5)*70}deg`;
    add(s,2700);
  },i*85);
  if(F[k]){
    const f=document.createElement('span');f.className='fly';f.textContent=F[k][0];
    f.style.top=F[k][1]==='__low'?(r.bottom+8)+'px':F[k][1]==='__high'?(r.top-10)+'px':F[k][1];
    f.style.setProperty('--fy',F[k][2]);setTimeout(()=>add(f,3500),300);
  }
}
const N=P.length, L=N+2; // cover + pages + final page
const book=document.getElementById('book'),hint=document.getElementById('hint');
const leaves=[];
const stars=[[18,22,18],[78,14,14],[84,78,20],[12,80,12],[50,9,10]].map(([x,y,s])=>`<span class="star" style="left:${x}%;top:${y}%;font-size:${s}px;animation-delay:${x%5*.3}s">✦</span>`).join('');
for(let i=0;i<L;i++){
  const el=document.createElement('div');el.className='leaf';el.style.zIndex=L-i;
  let front,back;
  if(i===0){
    front=`<div class="face cover"><div class="sp"></div>${stars}<div class="ttl"><i>MY</i><b>11:11</b><i>WISH</i><small>✦ tap to open ✦</small></div><div class="shade"></div></div>`;
    back=`<div class="face back ic">✦</div>`;
  }else if(i===L-1){
    front=`<div class="face paper"><span class="deco">${D[i-1]}</span><div class="sig"><h2>I LOVE YOU,<br>RITIKA!!</h2><button id="cb">Close the book ✦</button></div><span class="pn">${i}</span><div class="shade"></div></div>`;
    back=`<div class="face back bp"></div>`;
  }else{
    front=`<div class="face paper"><span class="deco">${D[i-1]}</span><div class="txt"><p>${P[i-1]}</p></div><span class="pn">${i}</span><div class="shade"></div></div>`;
    back=`<div class="face back bp"></div>`;
  }
  el.innerHTML=`<div class="in">${front}${back}</div>`;
  el.in=el.querySelector('.in');el.shade=el.querySelector('.shade');
  book.appendChild(el);leaves.push(el);
}
/* fit text so every page is neat */
function fit(){
  const w=book.clientWidth;
  document.querySelectorAll('.txt').forEach(t=>{
    const p=t.firstElementChild;let s=w*.047;p.style.fontSize=s+'px';
    while(p.scrollHeight>t.clientHeight&&s>10){s-=.5;p.style.fontSize=s+'px'}
  });
}
addEventListener('resize',fit);fit();document.fonts&&document.fonts.ready.then(fit);

/* page sound */
let ac;
function sfx(v=.1){try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const d=.55,n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),o=b.getChannelData(0);
  for(let i=0;i<n;i++)o[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);
  const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.8;
  f.frequency.setValueAtTime(2600,ac.currentTime);f.frequency.exponentialRampToValueAtTime(700,ac.currentTime+d);
  const g=ac.createGain();g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}catch(e){}}

/* page turn */
let cur=0,busy=false;
const EASE='cubic-bezier(.45,.05,.25,1)';
function flip(i,dir,dur=1150){
  const leaf=leaves[i],nx=leaves[i+1];
  (leaf.an||[]).forEach(a=>a.cancel());
  leaf.classList.remove('gone');leaf.style.zIndex=300+(dir>0?0:i);
  const o={duration:dur,easing:EASE,fill:'forwards',direction:dir>0?'normal':'reverse'};
  const T=a=>'rotateY('+a+'deg)';
  const a1=leaf.in.animate([{transform:T(0)},{transform:T(-70)+' skewY(-2.5deg) scaleX(.98)',offset:.4},{transform:T(-110)+' skewY(1.5deg)',offset:.62},{transform:T(-178)}],o);
  const a2=leaf.animate([{opacity:1},{opacity:1,offset:.7},{opacity:0}],o);
  leaf.shade.animate([{opacity:0},{opacity:.5,offset:.45},{opacity:.12}],{duration:dur,easing:EASE,direction:o.direction});
  if(nx)nx.shade.animate([{opacity:.38},{opacity:0}],{duration:dur,easing:'ease-out',direction:o.direction});
  leaf.an=[a1,a2];
  a1.onfinish=()=>{
    if(dir>0){leaf.classList.add('gone')}
    else{a1.cancel();a2.cancel();leaf.style.zIndex=L-i}
  };
  sfx(dir>0?.11:.08);
}
function status(){
  book.classList.toggle('closed',cur===0);
  hint.style.opacity=1;
  hint.textContent=cur===0?'tap the book to open it':(cur<L-1?'tap to turn the page · swipe or use ← →':'');
}
function next(){
  if(busy)return;
  if(cur>=L-1){closeBook();return}
  busy=true;flip(cur,1);cur++;status();setTimeout(()=>busy=false,850);const at=cur;setTimeout(()=>{if(cur===at)pop(at)},700);
}
function prev(){
  if(busy||cur===0)return;
  busy=true;cur--;flip(cur,-1);status();setTimeout(()=>busy=false,850);const at=cur;setTimeout(()=>{if(cur===at)pop(at)},700);
}

/* closing: last page turns, pages riffle shut, book thuds closed, fireworks */
function closeBook(){
  if(busy)return;busy=true;hint.style.opacity=0;
  flip(cur,1);cur++;
  setTimeout(()=>{
    for(let k=0;k<L;k++){
      setTimeout(()=>{cur--;flip(cur,-1,620)},k*85);
    }
    setTimeout(()=>{
      status();
      book.animate([{scale:1},{scale:.93},{scale:1.02},{scale:1}],{duration:700,easing:'ease-out'});
      sfx(.18);launchFireworks();
      document.getElementById('wish').classList.add('on');
      document.getElementById('again').classList.add('on');
      hint.textContent='';busy=false;
    },L*85+700);
  },1000);
}
function reopen(){
  document.getElementById('wish').classList.remove('on');
  document.getElementById('again').classList.remove('on');
  fwOn=false;status();
}
document.getElementById('again').addEventListener('click',e=>{e.stopPropagation();reopen();setTimeout(next,350)});

/* touch / click / keys */
let sx=0,sy=0;
book.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
book.addEventListener('pointerup',e=>{
  if(e.target.closest('button')){closeBook();return}
  const dx=e.clientX-sx;
  if(Math.abs(dx)>40&&Math.abs(e.clientY-sy)<80){dx<0?next():prev();return}
  if(Math.abs(dx)>10)return;
  const r=book.getBoundingClientRect();
  (cur>0&&e.clientX-r.left<r.width*.25)?prev():next();
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')next();
  if(e.key==='ArrowLeft')prev();
});
status();

/* sparkle background */
const bg=document.getElementById('bg'),bx=bg.getContext('2d');
let W,H,dpr=Math.min(devicePixelRatio||1,2);
const COLS=['255,255,255','255,205,225','200,218,255','255,232,176'];
let S=[],trail=[];
function size(c,x){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
function seed(){S=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*4.5,ph:Math.random()*6.28,sp:.4+Math.random()*1.2,c:COLS[Math.random()*4|0],dy:.05+Math.random()*.15}))}
function star(x,y,r){bx.beginPath();bx.moveTo(x,y-r);bx.quadraticCurveTo(x,y,x+r,y);bx.quadraticCurveTo(x,y,x,y+r);bx.quadraticCurveTo(x,y,x-r,y);bx.quadraticCurveTo(x,y,x,y-r);bx.fill()}
function loop(t){
  bx.clearRect(0,0,W,H);
  S.forEach(s=>{
    const a=.25+.75*Math.pow((Math.sin(t/1000*s.sp+s.ph)+1)/2,2);
    s.y-=s.dy;if(s.y<-10){s.y=H+10;s.x=Math.random()*W}
    bx.fillStyle=`rgba(${s.c},${a})`;bx.shadowColor=`rgba(${s.c},.9)`;bx.shadowBlur=8;
    star(s.x,s.y,s.r*(.6+.4*a));
  });
  bx.shadowBlur=0;
  trail=trail.filter(p=>p.l>0);
  trail.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.l-=.02;bx.fillStyle=`rgba(${p.c},${p.l})`;star(p.x,p.y,p.r*p.l)});
  requestAnimationFrame(loop);
}
function sparkle(e){for(let i=0;i<3;i++)trail.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.8)*1.2,l:1,r:2+Math.random()*4,c:COLS[Math.random()*4|0]})}
addEventListener('pointermove',sparkle);addEventListener('pointerdown',sparkle);
function resizeAll(){size(bg,bx);seed();size(fw,fx)}
const fw=document.getElementById('fw'),fx=fw.getContext('2d');
addEventListener('resize',resizeAll);resizeAll();requestAnimationFrame(loop);

/* fireworks */
let fwOn=false,parts=[];
const HUES=[340,215,45,280,190,10];
function burst(x,y){
  const h=HUES[Math.random()*HUES.length|0],n=70;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n+Math.random()*.1,v=1.5+Math.random()*4.2;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:h+Math.random()*30-15,r:1.4+Math.random()*1.6});
  }
}
function launchFireworks(){
  fwOn=true;parts=[];let n=0;
  const tick=()=>{
    if(!fwOn||n++>22)return;
    burst(W*(.15+Math.random()*.7),H*(.12+Math.random()*.45));
    setTimeout(tick,260+Math.random()*320);
  };
  tick();
  const draw=()=>{
    fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.2)';fx.fillRect(0,0,W,H);
    fx.globalCompositeOperation='lighter';
    parts=parts.filter(p=>p.l>0);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.045;p.l-=.011;
      fx.fillStyle=`hsla(${p.h},90%,68%,${Math.max(p.l,0)})`;
      fx.beginPath();fx.arc(p.x,p.y,p.r,0,6.283);fx.fill();
    });
    if(fwOn||parts.length)requestAnimationFrame(draw);else fx.clearRect(0,0,W,H);
  };
  requestAnimationFrame(draw);
}
</script>
